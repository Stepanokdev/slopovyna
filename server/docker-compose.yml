# Behind Traefik with a Let's Encrypt resolver on an external "web" network. Every value below can be
# set in the shell or in a .env file next to this one (see .env.example); the defaults are the ones
# slop.bulava.app runs with. Secrets live outside the code directory, so uploading the code again
# never touches them.
services:
  app:
    build: .
    container_name: slopovyna
    restart: unless-stopped
    env_file: ${SLOP_ENV_FILE:-/opt/slopovyna-secrets/slopovyna.env}
    volumes:
      - ${SLOP_DATA:-/opt/slopovyna-data}:/data
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slopovyna.rule=Host(`${SLOP_HOST:-slop.bulava.app}`)"
      - "traefik.http.routers.slopovyna.entrypoints=websecure"
      - "traefik.http.routers.slopovyna.tls.certresolver=letsencrypt"
      - "traefik.http.services.slopovyna.loadbalancer.server.port=3000"
networks:
  web:
    external: true
